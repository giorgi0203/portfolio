name: Portfolio deployment

on:
  push:
    branches: [codex/portfolio-subdomains]
    paths:
      - '.github/workflows/portfolio-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This is a prebuilt, browser-tested release. Future source updates need
      # a new validated artifact, artifact commit and checksum before deployment.
      - name: Install verified release on the droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            ip -4 -o addr show | grep -q '138.68.64.163/'
            stage=/tmp/giorgi-portfolio-${{ github.sha }}
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/portfolio/2cd67a1c8e9ca2de4148ed4b5ea149a164803fc9/portfolio-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' '0271393d766790abfce41dcf35edceb7329fe755e61396c4dd921e767ce79e22' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n bash "$stage/deploy/install-portfolio.sh" "$stage" ${{ github.sha }}
