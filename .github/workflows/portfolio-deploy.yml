name: Portfolio deployment

on:
  push:
    branches: [codex/portfolio-subdomains]
    paths:
      - '.github/workflows/portfolio-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This is a prebuilt, browser-tested release. Future source updates need
      # a new validated artifact, artifact commit and checksum before deployment.
      - name: Install verified release on the droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            stage=/tmp/giorgi-portfolio-${{ github.sha }}
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/portfolio/04e35251e1a4c97f946e2dfc2154e5111e35debd/portfolio-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' 'e6f05d4f817817f8e42bdfe16e0798714c5974122cff98780e0af7fed2d45982' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n bash "$stage/deploy/install-portfolio.sh" "$stage" ${{ github.sha }}

      - name: Verify the five-app showcase and shared sign-in in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/showcase-browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require(process.env.RUNNER_TEMP+'/showcase-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              page.setDefaultTimeout(45000);
              let googleLoads=0;
              await page.route('https://www.googletagmanager.com/**',route=>{googleLoads++;return route.fulfill({contentType:'application/javascript',body:'window.__googleConsentTest=true;'});});
              await page.goto('https://giorgi.app/',{waitUntil:'domcontentloaded'});
              await page.getByRole('button',{name:'Owner sign-in',exact:false}).waitFor();
              assert.equal(await page.locator('[data-app-card]').count(),5);
              for(const [title,host] of [['Angular Learning Lab','angular-compiler'],['HLS Inspector','hls-player'],['Developer Toolbox','toolbox'],['Website Health','status']])assert.equal(await page.getByRole('link',{name:'Open '+title,exact:true}).getAttribute('href'),'https://'+host+'.giorgi.app/');
              for(const host of ['example-mcp','mcp','api'])assert.equal(await page.locator('a[href^="https://'+host+'.giorgi.app"]').count(),0);
              await page.keyboard.press('Meta+Period');
              await page.frameLocator('iframe[title="Giorgi account sign-in"]').getByRole('heading',{name:'Good to see you.',exact:true}).waitFor();
              await page.getByRole('button',{name:'Close sign-in',exact:true}).click();
              await page.setViewportSize({width:390,height:844});
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              assert.equal(googleLoads,0);
              await page.setViewportSize({width:1440,height:1000});
              await page.getByRole('button',{name:'Allow Google Analytics',exact:true}).click();
              await page.waitForFunction(()=>window.__googleConsentTest);
              assert.equal(googleLoads,1);
              assert.ok(await page.evaluate(()=>window.dataLayer.some(command=>command[0]==='config'&&command[1]==='G-VWCF70ZQWB')));
              await page.locator('[data-cat-sprite]').waitFor({state:'visible'});
              assert.equal(await page.locator('[data-cat-sprite]').evaluate(element=>getComputedStyle(element).pointerEvents),'none');
              await page.getByRole('button',{name:'Cat: pause',exact:true}).click();
              assert.equal(await page.locator('[data-cat-sidekick]').getAttribute('data-state'),'paused');
              await page.getByRole('button',{name:'Cat: play',exact:true}).click();
              await page.getByRole('button',{name:'Pet the cat',exact:true}).waitFor();
              await page.getByRole('button',{name:'Play with the cat',exact:true}).waitFor();
              await page.getByRole('button',{name:'Let the cat nap',exact:true}).waitFor();
              console.log('PASS live illustrated cat, activity controls, click-through artwork and pause/play');
              console.log('PASS live GA consent and configured property (Google script stubbed)');
              console.log('PASS live five-app gallery, correct HTTPS links, shared login modal and mobile layout');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS

      - name: Verify public SEO assets and configured GA property
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            const html=await (await fetch('https://giorgi.app/')).text();
            assert.ok(html.includes('rel="canonical" href="https://giorgi.app/"'));
            assert.ok(html.includes('property="og:image"'));
            const schema=JSON.parse(html.match(/<script type="application\/ld\+json">(.*?)<\/script>/s)[1]);
            assert.ok(schema['@graph'].some(value=>value['@type']==='Person'));
            assert.ok(html.includes('interactive Angular lessons'));
            assert.ok((await (await fetch('https://giorgi.app/robots.txt')).text()).includes('Sitemap: https://giorgi.app/sitemap.xml'));
            assert.ok((await (await fetch('https://giorgi.app/sitemap.xml')).text()).includes('<loc>https://giorgi.app/</loc>'));
            assert.ok((await (await fetch('https://giorgi.app/privacy.html')).text()).includes('Optional Google Analytics'));
            const config=await (await fetch('https://giorgi.app/analytics-config.json')).json();assert.equal(config.measurementId,'G-VWCF70ZQWB');
            console.log('PASS public SEO metadata, initial HTML, schema, robots/sitemap/privacy; GA configured for G-VWCF70ZQWB');
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
