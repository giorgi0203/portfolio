name: Portfolio deployment
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/portfolio-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 2m
          script: |
            set -eu
            ip -4 -o addr show | grep -q '138.68.64.163/'
            sudo -n nginx -T 2>/dev/null | sed -n '/^# configuration file /p;/server_name /p;/root /p;/proxy_pass /p;/location /p'
            for host in giorgi.app www.giorgi.app smart-todolist.giorgi.app hls-player.giorgi.app; do
              printf '\nChecking %s\n' "$host"
              curl --fail --silent --show-error --location --max-time 15 "https://$host/" -o /tmp/giorgi-site-check.html -w 'HTTP %{http_code}\n' && grep -o '<title>[^<]*' /tmp/giorgi-site-check.html || true
            done
