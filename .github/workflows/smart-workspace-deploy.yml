name: Smart workspace deployment
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the tested workspace bundle
        uses: appleboy/ssh-action@v1.0.0
        env:
          SMART_TODO_AI_KEY: ${{ secrets.SMART_TODO_AI_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: SMART_TODO_AI_KEY
          timeout: 30s
          command_timeout: 6m
          script: |
            set -eu
            test -n "$SMART_TODO_AI_KEY"
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            stage=/tmp/smart-workspace-14131389ac1d1af45dad8f7ea23d427880c0b3b0
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/smart-todolist/14131389ac1d1af45dad8f7ea23d427880c0b3b0/workspace-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' 'c721b26aa7b2894e49e7459caa89246ae633eb982f2d5ca9559347917d9a48b4' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n --preserve-env=SMART_TODO_AI_KEY bash "$stage/deploy/install-shared-suite.sh" "$stage" a1032203f52cb78a4d1a5b1ffd471b7d1bae8927
            unset SMART_TODO_AI_KEY
