name: Smart workspace deployment
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the tested workspace bundle
        uses: appleboy/ssh-action@v1.0.0
        env:
          SMART_TODO_AI_KEY: ${{ secrets.SMART_TODO_AI_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: SMART_TODO_AI_KEY
          timeout: 30s
          command_timeout: 6m
          script: |
            set -eu
            test -n "$SMART_TODO_AI_KEY"
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            stage=/tmp/smart-workspace-a3076a0b88c38167bf172b2f1059574a2e67f3aa
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/smart-todolist/a3076a0b88c38167bf172b2f1059574a2e67f3aa/workspace-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' 'f83482f69bf3c787bfe7ea5935b31b20b13eff7a9284b8dbb74aa1d6afac7712' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n --preserve-env=SMART_TODO_AI_KEY bash "$stage/deploy/install-workspace.sh" "$stage" 097a0803f514c955da9576e23ff212fbfa8fcd1e
            unset SMART_TODO_AI_KEY
            sudo -n python3 "$stage/deploy/verify-workspace.py"
