name: Smart workspace deployment
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        env:
          SMART_TODO_AI_KEY: ${{ secrets.SMART_TODO_AI_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: SMART_TODO_AI_KEY
          command_timeout: 2m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            systemctl show smart-todolist-web -p User -p WorkingDirectory -p ExecStart -p DropInPaths
            python3 - <<'PY'
            import json,os,urllib.request,urllib.error
            key=os.environ.get('SMART_TODO_AI_KEY','').strip()
            print('New OpenAI key configured:',bool(key))
            if not key: raise SystemExit('Missing GitHub repository secret SMART_TODO_AI_KEY')
            payload={'model':'gpt-4.1-mini','max_tokens':40,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':'Return JSON only.'},{'role':'user','content':'Return {"connected":true}'}]}
            req=urllib.request.Request('https://api.openai.com/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                result=json.load(r)
                answer=json.loads(result['choices'][0]['message']['content'])
                assert answer.get('connected') is True
                print('OpenAI real JSON response verified:',r.status)
            except urllib.error.HTTPError as e:
              raw=e.read()
              try: code=json.loads(raw).get('error',{}).get('code')
              except Exception: code='unreadable'
              print('OpenAI failed:',e.code,'error code:',code)
              raise SystemExit(1)
            PY
