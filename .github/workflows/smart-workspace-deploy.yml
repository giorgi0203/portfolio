name: Smart workspace deployment
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the tested workspace bundle
        uses: appleboy/ssh-action@v1.0.0
        env:
          SMART_TODO_AI_KEY: ${{ secrets.SMART_TODO_AI_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: SMART_TODO_AI_KEY
          timeout: 30s
          command_timeout: 6m
          script: |
            set -eu
            test -n "$SMART_TODO_AI_KEY"
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            stage=/tmp/smart-workspace-1aff2bf53e459a9f37225ac2f7a953635eef4ed2
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/smart-todolist/1aff2bf53e459a9f37225ac2f7a953635eef4ed2/workspace-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' '4ae3a1f6b9a4f002beabfa6249d9a06e6d3dd39f4059226c18c062d9333a2b0c' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n --preserve-env=SMART_TODO_AI_KEY bash "$stage/deploy/install-workspace.sh" "$stage" 2e815011cf4c4f361f8ec5ce306061692f6bf2bf
            unset SMART_TODO_AI_KEY
            sudo -n python3 "$stage/deploy/verify-workspace.py"
