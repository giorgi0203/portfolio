name: Verify live task workspace
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 3m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            test "$(basename "$(readlink -f /var/www/smart-todolist-workspace/current)")" = "0be8fb38a70d6beca1decf40a907ef4fb0b07557"
            script=/tmp/verify-workspace-0be8fb38a70d6beca1decf40a907ef4fb0b07557.py
            curl -fsS --max-time 30 https://raw.githubusercontent.com/giorgi0203/smart-todolist/0be8fb38a70d6beca1decf40a907ef4fb0b07557/deploy/verify-workspace.py -o "$script"
            printf '%s  %s\n' '65aac58b03ddb0f75ce47f61595bab0d56323496434fb3ca1d161f6dee2a1b99' "$script" | sha256sum --check --strict
            sudo -n python3 "$script"
