name: Verify live task workspace
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 3m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            test "$(basename "$(readlink -f /var/www/smart-todolist-workspace/current)")" = "ffc313420d5d13c89f623484fe7d31c261d9bf58"
            script=/tmp/verify-workspace-ffc313420d5d13c89f623484fe7d31c261d9bf58.py
            curl -fsS --max-time 30 https://raw.githubusercontent.com/giorgi0203/smart-todolist/ffc313420d5d13c89f623484fe7d31c261d9bf58/deploy/verify-workspace.py -o "$script"
            printf '%s  %s\n' '5340d57818447943476aae1a60c7dbf4e839db253fd1b76e2aa5de216a6be60b' "$script" | sha256sum --check --strict
            sudo -n python3 "$script"
