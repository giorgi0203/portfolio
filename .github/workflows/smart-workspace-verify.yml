name: Verify live task workspace
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/smart-workspace-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 3m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            script=/tmp/verify-workspace-6c40c071025fe9f8d5f495012c9b35aa1b00ae27.py
            curl -fsS --max-time 30 https://raw.githubusercontent.com/giorgi0203/smart-todolist/6c40c071025fe9f8d5f495012c9b35aa1b00ae27/deploy/verify-workspace.py -o "$script"
            printf '%s  %s\n' '6701cf52b7d10395f0439eb45231bf52ac1bb23ff481fd5623ca5e9ab034e69a' "$script" | sha256sum --check --strict
            sudo -n python3 "$script"
