name: Diagnose public shared-account connectivity
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/shared-auth-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-workspace-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test public DNS and HTTPS from outside the droplet
        run: |
          dig +short auth.giorgi.app A
          dig +short auth.giorgi.app AAAA
          for options in '-4 --http1.1' '-4 --http2' '-4 --tls-max 1.2' '-6 --http1.1'; do
            curl $options --max-time 15 --silent --show-error --head https://auth.giorgi.app/embed || true
          done
      - name: Test the live login modal in Chrome
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/giorgi-browser" playwright@1.56.1
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/giorgi-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('console',m=>{if(m.type()==='error')console.log('BROWSER ERROR',m.text());});
            page.on('requestfailed',r=>console.log('REQUEST FAILED',new URL(r.url()).origin+new URL(r.url()).pathname,r.failure()?.errorText));
            let failEmbed=true;
            await page.route('https://auth.giorgi.app/embed**',route=>failEmbed?route.abort('connectionclosed'):route.continue());
            await page.goto('https://giorgi.app/',{waitUntil:'networkidle'});
            await page.keyboard.press('Meta+Period');
            await page.getByRole('dialog').waitFor();
            await page.getByRole('button',{name:'Retry sign-in',exact:true}).waitFor({timeout:20000});
            failEmbed=false;
            await page.getByRole('button',{name:'Retry sign-in',exact:true}).click();
            await page.frameLocator('iframe[title="Giorgi account sign-in"]').getByRole('heading',{name:'Good to see you.',exact:true}).waitFor({timeout:20000});
            console.log('PASS live Chrome embedded connection failure, retry and loaded sign-in');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Inspect identity service and Nginx listeners
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 2m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            free -m
            df -h /tmp
            systemctl show giorgi-identity smart-todolist-web -p Id -p ActiveState -p NRestarts -p MemoryCurrent -p Result
            sudo -n ss -lntp | grep -E ':443|:80 |:3100|:3000'
            sudo -n nginx -T 2>&1 | grep -E 'configuration file|listen |server_name|ssl_protocols|ssl_reject_handshake|add_header|proxy_pass'
            curl -sS -I --max-time 10 https://auth.giorgi.app/embed
            journalctl -k --since '1 hour ago' --no-pager | grep -E 'Out of memory|Killed process|oom' | tail -8 || true
