name: Deploy HTTP Playground and Decision Department
on:
  push:
    branches: [codex/http-and-decisions, main]
    paths: ['.github/workflows/fun-apps-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: giorgi-fun-apps-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install verified apps with scoped rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 7m
          script: |
            set -eu
            stage=/var/tmp/giorgi-fun-${{ github.sha }}
            mkdir -p "$stage"
            trap 'rm -rf -- "$stage"' EXIT
            curl -fsSL --max-time 90 https://raw.githubusercontent.com/giorgi0203/portfolio/ad8673a6fedfa58f20f9fdc4ff3ba14fee4e5ca1/fun-apps-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' '531104e70feaae72d04d4b37633d31e8cebf25e7eece7d414f308ae726a31d4b' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n bash "$stage/deploy/install-fun-apps.sh" "$stage" ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 3364f78346fb4de69e0c25431e99241fb5618f30
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser harness
        run: npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Verify both apps over public HTTPS with two real browsers
        env:
          HTTP_URL: https://http-playground.giorgi.app
          DECISIONS_URL: https://decisions.giorgi.app
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright"
          node scripts/new-apps-browser.cjs
      - name: Verify room privacy and HTTPS service
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            const health=await fetch('https://decisions.giorgi.app/health');assert.equal(health.status,200);assert.equal((await health.json()).ok,true);
            for(const suffix of ['/room/00000000000000000000000000000000','/?room=00000000000000000000000000000000']){
              const response=await fetch('https://decisions.giorgi.app'+suffix);assert.equal(response.status,200);
              assert.match(response.headers.get('x-robots-tag')||'',/noindex/);assert.match(response.headers.get('cache-control')||'',/no-store/);assert.equal(response.headers.get('referrer-policy'),'no-referrer');
            }
            console.log('PASS real HTTPS health and noindex/no-store/no-referrer for room links');
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
  publish-portfolio:
    needs: deploy
    uses: ./.github/workflows/portfolio-deploy.yml
    secrets: inherit
