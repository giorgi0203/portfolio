name: Legacy standalone HLS deployment (superseded)

on:
  push:
    branches: [codex/hls-player-subdomain, codex/portfolio-subdomains]
    paths:
      - '.github/workflows/hls-player-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hls-player-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }} # Active products workflow now deploys HLS Inspector.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This is a prebuilt, browser-tested release. Future source updates need
      # a new validated artifact, artifact commit and checksum before deployment.
      - name: Install verified release on the droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            ip -4 -o addr show | grep '138.68.64.163/' >/dev/null
            stage=/tmp/giorgi-hls-${{ github.sha }}
            mkdir -p "$stage"
            curl --fail --location --silent --show-error --max-time 90 https://raw.githubusercontent.com/giorgi0203/portfolio/4db648be79e9a236e34bb4e63475cfc750ae4d11/hls-player-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' '0fe8d00650b9fb3a3150fb0296420944e64f6aabcda54b7363df007ca30b676b' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n bash "$stage/deploy/install-hls-player.sh" "$stage" ${{ github.sha }}
