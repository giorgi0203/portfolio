name: HLS Player deployment

on:
  push:
    branches: [codex/hls-player-subdomain]
    paths:
      - '.github/workflows/hls-player-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hls-player-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This is a prebuilt, browser-tested release. Future source updates need
      # a new validated artifact, artifact commit and checksum before deployment.
      - name: Install verified release on the droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            ip -4 -o addr show | grep -q '138.68.64.163/'
            sudo -n nginx -T 2>/dev/null | sed -n '/^# configuration file /p;/include .*sites-enabled/p;/include .*conf.d/p'
            sudo -n ls -l /etc/nginx/sites-enabled /etc/nginx/conf.d
            sudo -n find /var/www/hls-player -maxdepth 2 -type d
