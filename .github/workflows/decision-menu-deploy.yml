name: Decision Department menu deployment
on:
  push:
    branches: [codex/decision-menu, main]
    paths: ['.github/workflows/decision-menu-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: giorgi-decision-menu-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install tested menu and identity release with rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 7m
          script: |
            set -eu
            stage=/var/tmp/giorgi-decision-menu-${{ github.sha }}
            mkdir -p "$stage"
            trap 'rm -rf -- "$stage"' EXIT
            curl -fsSL --max-time 90 https://raw.githubusercontent.com/giorgi0203/portfolio/98c1d572cda68c7c2d8871f63b52894b6ddbd247/decision-menu-deploy.tar.gz -o "$stage/bundle.tar.gz"
            printf '%s  %s\n' '809092316a05aa205c1ccef10b204686710c97192f13159be7b576fc796d8fbc' "$stage/bundle.tar.gz" | sha256sum --check --strict
            tar -xzf "$stage/bundle.tar.gz" -C "$stage" --no-same-owner
            sudo -n bash "$stage/deploy/install-decision-menu.sh" "$stage" ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: a7ffe784a114129a5003bb983cdfbb421b27fbab
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser harness
        run: npm install --prefix "$RUNNER_TEMP/menu-browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Verify live menu planning and shared rooms in Chrome
        env:
          DECISIONS_URL: https://decisions.giorgi.app
          NEW_APPS_ONLY: decisions
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/menu-browser/node_modules/playwright"
          node scripts/decision-menu-browser.cjs
          node scripts/new-apps-browser.cjs
      - name: Check public scan gates and private room headers
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://decisions.giorgi.app';
            const session=await fetch(base+'/api/menu/session');const data=await session.json();assert.equal(data.user,null);assert.equal(data.configured,true);assert.equal(data.limits.daily,3);
            const response=await fetch(base+'/api/menu/analyze',{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify({image:'not-an-image'})});assert.equal(response.status,401);
            const room=await fetch(base+'/room/00000000000000000000000000000000');assert.match(room.headers.get('x-robots-tag')||'',/noindex/);assert.match(room.headers.get('cache-control')||'',/no-store/);assert.equal(room.headers.get('referrer-policy'),'no-referrer');
            console.log('PASS live anonymous scan protection, configured limits and private room headers');
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
