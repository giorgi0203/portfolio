name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      # Run linting and testing (using explicit commands instead of affected)
      - run: npx nx lint portfolio
      - run: npx nx test portfolio

      # Build the portfolio app for production
      - run: npx nx build portfolio --configuration=production

      # Deployment is owned by portfolio-deploy.yml; never stop shared Nginx here.
      # Upload build artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/apps/portfolio/
          retention-days: 1
