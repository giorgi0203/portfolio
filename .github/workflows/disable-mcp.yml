name: Disable retired MCP demos
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/disable-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: giorgi-extra-apps-deployment
  cancel-in-progress: false
jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          command_timeout: 3m
          script: |
            set -eu
            file=/var/tmp/disable-mcp-b76949a45bc24da7fb226ec29183b37a9da281af.sh
            curl -fsSL --max-time 30 https://raw.githubusercontent.com/giorgi0203/portfolio/b76949a45bc24da7fb226ec29183b37a9da281af/deploy/disable-mcp.sh -o "$file"
            printf '%s  %s\n' 'e810bd084b1b1528202a0c2181ef4c93e1b7940d1db1465012f40defd062ba6d' "$file" | sha256sum --check --strict
            sudo -n bash "$file"
            rm -f "$file"
      - name: Verify public MCP endpoints are disabled and API stays online
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            for(const host of ['example-mcp','mcp'])for(const path of ['/','/mcp','/mcp/example']){
              const response=await fetch('https://'+host+'.giorgi.app'+path,{signal:AbortSignal.timeout(10000)});assert.equal(response.status,410);
            }
            assert.equal((await fetch('https://api.giorgi.app/api/health')).status,200);
            assert.equal((await fetch('https://angular-compiler.giorgi.app/health')).status,200);
            console.log('PASS public MCP endpoints disabled; API and compiler remain healthy');
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
