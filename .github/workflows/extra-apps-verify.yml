name: Verify live experiment apps
on:
  push:
    branches: [codex/portfolio-subdomains]
    paths: ['.github/workflows/extra-apps-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d64e8ddb3ede7fcff5e257e18514d43f48fa026
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check analytics forwarding for every new host
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{for(const name of ['angular-compiler','example-mcp','mcp','api']){
            const origin='https://'+name+'.giorgi.app',started=Date.now();
            const response=await fetch(origin+'/api/analytics/event',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({kind:'pageview',label:'home'}),signal:AbortSignal.timeout(10000)});
            assert.equal(response.status,200,origin+' analytics status');assert.equal((await response.json()).ok,true);
            console.log('PASS anonymous analytics forwarding:',name,Date.now()-started,'ms');
          }})().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - name: Check the actual editor, examples, API docs and developer pages
        env:
          COMPILER_UI_URL: https://angular-compiler.giorgi.app/
          EXAMPLE_URL: https://example-mcp.giorgi.app
          GATEWAY_URL: https://mcp.giorgi.app
          CATALOG_URL: https://api.giorgi.app
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node scripts/check-compiler-browser.cjs
