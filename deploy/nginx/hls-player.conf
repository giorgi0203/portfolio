# Install only after uploading the production build to the current release.
# Certbot adds HTTPS after DNS resolves to this droplet.
server {
    listen 80;
    listen [::]:80;
    server_name hls-player.giorgi.app;
    root /var/www/hls-player/current;
    index index.html;

    # A federation host on giorgi.app can load this app's public assets.
    add_header Access-Control-Allow-Origin "https://giorgi.app" always;
    add_header X-Content-Type-Options nosniff always;

    # Federation entry points must refresh when deploying a new version.
    location ~ ^/(?:mf-manifest\.json|mf-stats\.json|remoteEntry\.mjs|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "https://giorgi.app" always;
        try_files $uri =404;
    }

    # Explicit JS MIME type works on older Ubuntu Nginx versions too.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|ico|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
