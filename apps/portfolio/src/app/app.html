<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="nav-wrap" aria-label="Main navigation">
    <a routerLink="/" class="brand" aria-label="Giorgi Arabuli — home">
      <span class="brand-mark" aria-hidden="true">g.</span>
      <span class="brand-name"
        >giorgi.app<span>a personal work in progress</span></span
      >
    </a>
    <div class="nav-links">
      <details class="app-menu" #appsMenu>
        <summary>My apps <span aria-hidden="true">⌄</span></summary>
        <div class="app-menu-panel">
          <a href="#projects" (click)="appsMenu.open = false"
            >The whole junk drawer <span>↓</span></a
          >
          @for (app of deployedApps; track app.id) {
          <a [href]="app.liveUrl" (click)="appsMenu.open = false"
            >{{ app.title }}
            <svg class="icon" aria-hidden="true"><use href="#i-up-right" /></svg
          ></a>
          }
        </div>
      </details>
      <a href="#about" class="about-link">The human</a>
      <a
        href="https://github.com/giorgi0203"
        class="github-link"
        aria-label="Giorgi on GitHub"
        target="_blank"
        rel="noopener noreferrer"
        ><svg class="icon" aria-hidden="true"><use href="#i-github" /></svg
        ><span>GitHub</span
        ><svg class="icon small-arrow" aria-hidden="true">
          <use href="#i-up-right" /></svg
      ></a>
    </div>
  </nav>
</header>
<router-outlet></router-outlet>

<button class="owner-entry" type="button" (click)="openOwnerLogin()">Owner sign-in <kbd>⌘ .</kbd></button>
<dialog #ownerDialog class="owner-dialog" aria-labelledby="owner-title" (close)="loginOpen=false">
  <header><h2 id="owner-title">Your Giorgi account</h2><button type="button" aria-label="Close sign-in" (click)="closeOwnerLogin()">×</button></header>
  @if (loginOpen) {<iframe #identityFrame [src]="authEmbed" title="Giorgi account sign-in" referrerpolicy="strict-origin"></iframe>}
  <p><a href="https://auth.giorgi.app/?continue=/analytics">Open sign-in in a full page</a></p>
</dialog>
