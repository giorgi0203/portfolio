<div #controls class="cat-controls">
  <span><span aria-hidden="true">✧</span> Chief Distraction Officer</span>
  <button
    type="button"
    class="cat-toggle"
    [attr.aria-pressed]="!paused()"
    (click)="toggle()"
  >
    Cat: {{ paused() ? 'play' : 'pause' }}
    <span aria-hidden="true">{{ paused() ? '▷' : 'Ⅱ' }}</span>
  </button>
  <div class="cat-activities" role="group" aria-label="Cat activities">
    <button type="button" aria-label="Pet the cat" (click)="action('pet')">
      Pet <span aria-hidden="true">♡</span>
    </button>
    <button
      type="button"
      aria-label="Play with the cat"
      (click)="action('play')"
    >
      Play <span aria-hidden="true">✧</span>
    </button>
    <button
      type="button"
      aria-label="Let the cat nap"
      (click)="action('sleep')"
    >
      Nap <span aria-hidden="true">z</span>
    </button>
  </div>
